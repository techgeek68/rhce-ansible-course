---
- name: Return the managed hosts to a clean state
  hosts: servera,serverb,serverc,serverd
  become: true
  gather_facts: false
  tasks:
    - name: Remove exercise accounts
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: true
      loop: [ana, raj, lee]

    - name: Remove exercise groups
      ansible.builtin.group:
        name: "{{ item }}"
        state: absent
      loop: [ops, audit]

    - name: Remove the kernel parameter file
      ansible.builtin.file:
        path: /etc/sysctl.d/90-db.conf
        state: absent

    - name: Remove sysstat
      ansible.builtin.dnf:
        name: sysstat
        state: absent

    - name: Empty the login banner
      ansible.builtin.copy:
        content: ""
        dest: /etc/motd
        mode: "0644"

    - name: SELinux enforcing everywhere
      ansible.builtin.command: setenforce 1
      changed_when: false
      failed_when: false
