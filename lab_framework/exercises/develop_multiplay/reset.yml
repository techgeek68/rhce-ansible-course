---
- name: Return servera to a clean state
  hosts: servera
  become: true
  gather_facts: false
  tasks:
    - name: Remove httpd
      ansible.builtin.dnf:
        name: httpd
        state: absent

    - name: Remove the intranet page
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: absent

    - name: Close http in the permanent firewall configuration
      ansible.builtin.command: firewall-cmd --permanent --remove-service=http
      register: fw
      changed_when: "'success' in fw.stdout"
      failed_when: false

    - name: Reload the firewall
      ansible.builtin.command: firewall-cmd --reload
      changed_when: false

- name: Return serverb to a clean state
  hosts: serverb
  become: true
  gather_facts: false
  tasks:
    - name: Remove the probe report
      ansible.builtin.file:
        path: /home/student/intranet_probe.txt
        state: absent

    - name: Empty the login banner
      ansible.builtin.copy:
        content: ""
        dest: /etc/motd
        mode: "0644"
