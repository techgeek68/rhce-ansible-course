---
- name: Return servera to a clean state
  hosts: servera
  become: true
  gather_facts: false
  tasks:
    - name: Stop httpd if present
      ansible.builtin.command: systemctl disable --now httpd
      changed_when: false
      failed_when: false

    - name: Remove site files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/www/sites
        - /etc/httpd/conf.d/main.conf
        - /etc/httpd/conf.d/docs.conf

    - name: Remove httpd
      ansible.builtin.dnf:
        name: httpd
        state: absent

    - name: Close the site ports in the permanent firewall configuration
      ansible.builtin.shell: |
        firewall-cmd --permanent --remove-port=80/tcp
        firewall-cmd --permanent --remove-port=8008/tcp
        firewall-cmd --reload
      changed_when: false
      failed_when: false
