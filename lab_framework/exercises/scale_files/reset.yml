---
- name: Return the web hosts to a clean state
  hosts: servera,serverb
  become: true
  gather_facts: false
  tasks:
    - name: Stop httpd if present
      ansible.builtin.command: systemctl disable --now httpd
      changed_when: false
      failed_when: false

    - name: Remove web content
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/www/html/index.html
        - /var/www/html/health.txt

    - name: Remove httpd
      ansible.builtin.dnf:
        name: httpd
        state: absent

    - name: Close http and https in the permanent firewall configuration
      ansible.builtin.shell: |
        firewall-cmd --permanent --remove-service=http
        firewall-cmd --permanent --remove-service=https
        firewall-cmd --reload
      changed_when: false
      failed_when: false
