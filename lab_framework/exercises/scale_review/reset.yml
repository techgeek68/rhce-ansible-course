---
- name: Return the application servers to a clean state
  hosts: servera,serverb,serverc,serverd
  become: true
  gather_facts: false
  tasks:
    - name: Stop httpd if present
      ansible.builtin.command: systemctl disable --now httpd
      changed_when: false
      failed_when: false

    - name: Remove the status page
      ansible.builtin.file:
        path: /var/www/html/status
        state: absent

    - name: Remove httpd
      ansible.builtin.dnf:
        name: httpd
        state: absent

    - name: Close http and https in the permanent firewall configuration
      ansible.builtin.shell: |
        firewall-cmd --permanent --remove-service=http
        firewall-cmd --permanent --remove-service=https
        firewall-cmd --reload
      changed_when: false
      failed_when: false
