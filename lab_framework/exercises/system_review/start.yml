---
- name: Publish the lab repository
  ansible.builtin.import_playbook: ../../lib/lab_repo.yml

- name: Prepare the system_review lab
  hosts: workstation
  gather_facts: false
  vars:
    project_dir: /home/student/system_review
  tasks:
    - name: Verify the developer services
      ansible.builtin.include_tasks: "{{ lab_lib }}/require_devtools.yml"

    - name: Build the project
      ansible.builtin.include_tasks: "{{ lab_lib }}/project_skeleton.yml"

    - name: Provide the RHEL system roles collection in the project
      ansible.builtin.include_tasks: "{{ lab_lib }}/project_system_roles.yml"

    - name: Key directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}/files/keys"
        state: directory
        mode: "0700"

    - name: Generate SSH key pairs for the operators
      ansible.builtin.command:
        cmd: ssh-keygen -q -t ed25519 -N '' -C "{{ item }}@lab" -f {{ project_dir }}/files/keys/{{ item }}
        creates: "{{ project_dir }}/files/keys/{{ item }}.pub"
      loop:
        - ops1
        - ops2

- name: Reset the managed hosts
  ansible.builtin.import_playbook: reset.yml
