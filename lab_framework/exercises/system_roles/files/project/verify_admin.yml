---
- name: Show time and SELinux settings
  hosts: web
  become: true
  gather_facts: false
  tasks:
    - name: Collect the settings
      ansible.builtin.shell: |
        echo "zone:    $(timedatectl show -p Timezone --value)"
        echo "ntp:     $(grep -E '^(server|pool) ' /etc/chrony.conf | tr '\n' ' ')"
        echo "boolean: $(getsebool httpd_can_network_connect)"
        echo "port:    $(semanage port -l 2>/dev/null | grep -w 8088 || echo 'not labeled')"
      register: settings
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        var: settings['stdout_lines']
